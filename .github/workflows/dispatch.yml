name: dispatch

on:
  workflow_dispatch:
    inputs:
      buildMode:
        description: 'Build mode'
        required: false
        default: 'Plugin'
        type: choice
        options: ['Plugin','All']
      gradleExpandParameters:
        description: 'Gradle build expand parameters'
        required: false
      artifactSaveDays:
        description: "Artifact retention days"
        required: false
        default: '90'
        type: choice
        options: ['0','1','7','14','30','60','90']
      additionalFunctions:
        description: "Additional functions"
        required: false
        default: 'Not used'
        type: choice
        options: ['Not used','Build PR']
      PR_ID:
        description: 'PR number'
        required: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  Initialize:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      actionUrl: ${{ steps.getProjectInfo.outputs.actionUrl }}
      targetCommitId: ${{ env.targetCommitId }}
      targetBranch: ${{ env.targetBranch }}
      prState: ${{ steps.prInfo.outputs.prState }}
      repo_name: ${{ steps.getProjectInfo.outputs.repoNmae }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6
      - name: 处理和检查输入的参数
        uses: actions/github-script@v8
        with:
          script: |
            const additionalFunctions = "${{ inputs.additionalFunctions }}";
            if (additionalFunctions == 'Build PR') {
              const PR_ID = "${{ inputs.PR_ID }}";
              const prNumber = Number(PR_ID.trim());
              if (!Number.isInteger(prNumber) || prNumber <= 0) {
                core.setFailed(`The format of the PR number entered is incorrect. The input value is: ${PR_ID}`);
              }
            }
      - name: 获取信息
        uses: ./.github/actions/getProjectInfo
      - name: Summary base info
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # BUILD INFO
          |Tatget ref|Target sha|Artifact save days|
          |:-:|:-:|:-:|
          EOF
          if [ '${{ inputs.additionalFunctions }}' == 'Build PR' ]; then
            echo "|===|===|${{ inputs.artifactSaveDays }}|" >> $GITHUB_STEP_SUMMARY
          else
            echo "|${{ env.targetBranch }}|${{ env.targetCommitId }}|${{ inputs.artifactSaveDays }}|" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Get and summary PR info
        if: inputs.additionalFunctions == 'Build PR'
        id: prInfo
        uses: ./.github/actions/getPrInfo
        with:
          prId: ${{ inputs.PR_ID }}
          prApprove: true

  build-plugin:
    if: inputs.buildMode == 'Plugin' || inputs.buildMode == 'All' || inputs.additionalFunctions == 'Build PR'
    name: Build plugin
    needs: Initialize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      java-version: "17"
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6
      - name: 拉取 PR 代码
        if: inputs.additionalFunctions == 'Build PR'
        run: gh pr checkout ${{ inputs.PR_ID }} && ls -la
      - name: Setup java ${{ env.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.java-version }}
          distribution: 'temurin'
      - name:  Cache local Gradle wrapper and repository
        uses: ./.github/actions/cacheGradle
      - name: Replace info
        run: |
          classPath=Common/src/main/java/cn/stevei5mc/serverhelper/common/BaseInfo.java
          version=$(grep "project.version=" "./gradle.properties" | sed 's/project.version=//')
          sed -i 's|{git.commit.id}|${{ needs.Initialize.outputs.targetCommitId }}|g; s|{git.branch}|${{ needs.Initialize.outputs.targetBranch }}|g; s|{project.version}|'"$version"'|g' $classPath
      - name: Set gradlew 777 permission
        run: chmod 777 gradlew && ls -lah
      - name:  Build project
        run: ./gradlew shadowJar javadocJar --no-daemon --parallel ${{ inputs.gradleExpandParameters }}
      - name: Get artifact hash
        if: inputs.artifactSaveDays >= 1
        run: bash .github/workflows/scripts/getArtifactHash.sh
      - name: Copy files
        if: inputs.artifactSaveDays >= 1
        run:  bash .github/workflows/scripts/copyFiles.sh
      - name: Upload artifact
        if: inputs.artifactSaveDays >= 1
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.Initialize.outputs.repo_name }}-Dispatch-Build_${{ github.run_number }}
          retention-days: ${{ inputs.artifactSaveDays }}
          path: ./staging