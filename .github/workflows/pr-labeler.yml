name: PR labeler

concurrency:
  group: ${{ github.workflow }}-PR-${{ github.event.pull_request.number || inputs.prNumber }}
  cancel-in-progress: true

on:
  pull_request_target:
  workflow_dispatch:
    inputs:
      prNumber:
        description: 'PR number'
        required: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  pr-labeler:
    runs-on: ubuntu-slim
    name: PR labeler
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 分配标签
        id: labeler
        uses: actions/labeler@v6
        with:
          sync-labels: true
          configuration-path: .github/labeler.yml
          pr-number: ${{ github.event.pull_request.number || inputs.prNumber }}
      - name: 输出标签信息
        run: |
          echo "新标签： ${{ steps.labeler.outputs.new-labels }}"