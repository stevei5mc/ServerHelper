name: tag push

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  Initialize:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      version: ${{ steps.getReleaseInfo.outputs.version }}
      repoName: ${{ steps.getProjectInfo.outputs.repoNmae }}
      targetCommitId: ${{ env.targetCommitId }}
      targetBranch: ${{ env.targetBranch }}
      preRrelease: ${{ steps.getReleaseInfo.outputs.pre-release }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6
      - name: 获取信息
        id: getProjectInfo
        uses: ./.github/actions/getInfo/projectInfo
      - name: 获取版本发布信息
        id: getReleaseInfo
        uses: ./.github/actions/getInfo/releaseInfo
      - name: Summary base info
        uses: johngeorgewright/summary-action@v1.0.0
        with:
          summary: |
            # BUILD INFO
            |Tatget ref|Target sha|Release version|Release type|
            |:-:|:-:|:-:|
            | ${{ env.targetBranch }}|${{ env.targetCommitId }}|${{ steps.getReleaseInfo.outputs.version }}|${{ steps.getReleaseInfo.outputs.releaseType }}|

  build-plugin:
    name: Build and release plugin
    needs: Initialize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      java-version: "17"
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6
      - name: Setup java ${{ env.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.java-version }}
          distribution: 'temurin'
      - name:  Cache local Gradle wrapper and repository
        uses: ./.github/actions/cacheGradle
      - name: Replace info
        run: |
          classPath=Common/src/main/java/cn/stevei5mc/serverhelper/common/BaseInfo.java
          sed -i "s|project.version=*|project.version=${{ needs.Initialize.outputs.version }}|g" ./gradle.properties
          sed -i 's|{git.commit.id}|${{ needs.Initialize.outputs.targetCommitId }}|g; s|{git.branch}|${{ needs.Initialize.outputs.targetBranch }}|g; s|{project.version}|${{ needs.Initialize.outputs.version }}|g' $classPath
      - name: Set gradlew 777 permission
        run: chmod 777 gradlew && ls -lah
      - name:  Build project
        id: build
        run: ./gradlew shadowJar javadocJar --no-daemon --parallel
      - name: Get artifact hash
        run: bash .github/workflows/scripts/getArtifactHash.sh
      - name: Prepare releases files
        id: build
        run: bash .github/workflows/scripts/prepareReleasesFiles.sh
      - name: 上传测试报告
        if: steps.build.outcome == 'failure'
        uses: ./.github/actions/uploadTestReportFiles
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.Initialize.outputs.repoName }}-Release-${{ needs.Initialize.outputs.version }}
          path: ./staging
      - name: Release to github
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.Initialize.outputs.version }}
          name: ${{ needs.Initialize.outputs.version }}
          token: ${{ env.GH_TOKEN }}
          bodyFile: ./docs/changelogs/${{ needs.Initialize.outputs.version }}.md
          artifacts: ./staging/*.*
          prerelease: ${{ needs.Initialize.outputs.pre-release }}