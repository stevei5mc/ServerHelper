name: "Upload test report files"
description: "Upload test report files"

inputs:
  artifactName:
    description: "Artifact name"
    required: true

runs:
  using: "composite"
  steps:
    - name: 上传报告文件
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifactName }}
        path: |
          ./Common/build/reports/tests
          ./Nukkit/build/reports/tests